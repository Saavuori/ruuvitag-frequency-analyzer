# Application configuration for the RuuviTag frequency analyzer.
#
# Peripheral *and* broadcaster. Broadcaster-only would keep the attack surface
# at zero, but eight advertisements per spectrum caps the broadcast path at one
# 2.56 s snapshot per ten seconds, and that is not an instrument. See ADR-0002.

CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=n
CONFIG_BT_OBSERVER=n
CONFIG_BT_DEVICE_NAME="RuuviFreq"

# One host at a time. A second connection would halve the radio time available
# to the first and there is no use case for two simultaneous captures.
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# Throughput. 400 Hz x 3 axes x 2 bytes is 2.4 kB/s of payload, which BLE
# manages comfortably - but only with a large ATT MTU and Data Length
# Extension. At the default 23-byte MTU each notification carries 2 samples and
# the per-packet overhead dominates; at 247 it carries 39.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y

# 2M PHY halves air time per packet on a part that supports it. The host may
# decline; the stream works either way, just with less headroom. Zephyr 4.x
# runs the PHY update automatically - BT_AUTO_PHY_UPDATE is deprecated and
# setting it is now an error, not a preference.
CONFIG_BT_CTLR_PHY_2M=y

# +4 dBm, the nRF52832's maximum, up from the 0 dBm default. Four decibels is
# roughly 1.6x the range, and range is what decides whether a tag bolted to a
# steel appliance can be reached at all - a tag you cannot hear reports nothing,
# however efficient it is.
#
# BT_CTLR_TX_PWR_DBM follows this automatically, so DF5's TX power field stays
# truthful without touching main.c.
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# Extra TX buffers so the notification thread can queue ahead of the radio
# instead of stalling on -ENOMEM every connection interval.
CONFIG_BT_BUF_ACL_TX_COUNT=8

# Hardware float: the nRF52832 is a Cortex-M4F and the broadcast transform runs
# once per 1.28 s, so float is both simpler and cheaper here than fixed point.
CONFIG_FPU=y

# Sensors over SPI: LIS2DH12 accelerometer, BME280 environment.
CONFIG_SENSOR=y
CONFIG_SPI=y

# SAADC, for the coin-cell voltage on DF5's battery field. Without it the tag
# cannot report its own supply and a deployment can only be understood by
# fetching it back.
CONFIG_ADC=y

# GPIO interrupts, for the accelerometer's activity line on INT1 (P0.02).
CONFIG_GPIO=y
# Zephyr's LIS2DH driver has no FIFO support, so src/lis2dh12.c drives the chip
# directly over SPI using the same devicetree node. Leaving the Zephyr driver
# enabled would have two owners configuring one chip.
CONFIG_LIS2DH=n
CONFIG_BME280=y

CONFIG_LOG=y

# Logging over SEGGER RTT. The tag has no exposed UART, and RTT works through
# the same SWD link the DevShield already provides, so this is the only way to
# see a fault message from a running tag.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
# Deferred, not immediate: the software Link Layer forbids immediate logging
# (it would block in ISR context and wreck radio timing).
CONFIG_LOG_MODE_DEFERRED=y

# Catch a stack overflow as a named error instead of a random hard fault.
CONFIG_THREAD_NAME=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_EXTRA_EXCEPTION_INFO=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
